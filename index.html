<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Islam Metwally | Senior Document Controller</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Inter:wght@400;500;600;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#F6F7F5;
    --paper:#FFFFFF;
    --ink:#20262B;
    --ink-soft:#5B6670;
    --line:#E3E7E4;
    --blue:#4C7A93;
    --blue-soft:#EAF1F4;
    --amber:#D9A441;
    --amber-soft:#FBF2DF;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background-color:var(--bg);
    background-repeat:repeat;
    background-size: 200px 200px;
    color:var(--ink);
    font-family:'Inter',sans-serif;
    display:flex;
    justify-content:center;
    padding:56px 20px 80px;
  }
  .page{ width:100%; max-width:600px; }
  .hero{ text-align:center; margin-bottom:34px; }
  .eyebrow{
    font-family:'Space Mono',monospace;
    font-size:11px;
    letter-spacing:.18em;
    text-transform:uppercase;
    color:var(--ink-soft);
    display:flex;
    align-items:center;
    justify-content:center;
    gap:10px;
    margin-bottom:22px;
  }
  .eyebrow::before,.eyebrow::after{
    content:"";
    height:1px; width:28px;
    background:var(--line);
  }
  h1{
    font-family:'Fraunces',serif;
    font-weight:500;
    font-size:44px;
    line-height:1.05;
    margin:0 0 6px;
    letter-spacing:-0.01em;
  }
  .arabic-name{
    font-size:18px;
    color:var(--ink-soft);
    margin:0 0 14px;
  }
  .role{
    font-size:15px;
    color:var(--ink-soft);
    margin:0;
  }
  .role b{ color:var(--ink); font-weight:600; }
  .tagline{
    margin-top:22px;
    font-family:'Fraunces',serif;
    font-style:italic;
    font-size:15px;
    color:var(--ink-soft);
  }
  .tagline .split{ color:var(--blue); }
  .tagline .split2{ color:var(--amber); }
  .avatar-wrap{
    width:132px;
    height:132px;
    margin:0 auto 22px;
    position:relative;
  }
  .avatar-ring{
    position:absolute;
    inset:-6px;
    border-radius:50%;
    background:conic-gradient(from 200deg, var(--blue), var(--amber), var(--blue));
    padding:2px;
  }
  .avatar-ring::before{
    content:"";
    position:absolute;
    inset:2px;
    border-radius:50%;
    background:var(--bg);
  }
  .avatar-wrap img{
    position:relative;
    width:100%;
    height:100%;
    border-radius:50%;
    object-fit:cover;
    display:block;
    border:3px solid var(--paper);
  }
  section{ margin-top:34px; }
  .section-label{
    font-family:'Space Mono',monospace;
    font-size:11px;
    letter-spacing:.14em;
    text-transform:uppercase;
    color:var(--ink-soft);
    margin:0 0 12px;
    padding-left:2px;
  }
  .card{
    background:var(--paper);
    border:1px solid var(--line);
    border-radius:14px;
    overflow:hidden;
  }
  .row{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:14px;
    padding:15px 18px;
    text-decoration:none;
    color:var(--ink);
    border-bottom:1px solid var(--line);
    transition:background .15s ease;
  }
  .row:last-child{ border-bottom:none; }
  a.row:hover{ background:var(--blue-soft); }
  .row .label{ display:flex; align-items:center; gap:12px; font-size:14.5px; font-weight:500; }
  .row .value{ font-size:13px; color:var(--ink-soft); text-align:right; direction:ltr; }
  .dot{
    width:7px; height:7px; border-radius:50%;
    flex:none;
    background:var(--blue);
  }
  .dot.amber{ background:var(--amber); }
  .info-grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:10px;
  }
  .info-cell{
    background:var(--paper);
    border:1px solid var(--line);
    border-radius:12px;
    padding:14px 16px;
  }
  .info-cell .k{
    font-family:'Space Mono',monospace;
    font-size:10.5px;
    letter-spacing:.08em;
    text-transform:uppercase;
    color:var(--ink-soft);
    margin-bottom:6px;
  }
  .info-cell .v{ font-size:14.5px; font-weight:600; }
  .badge-strip{
    display:flex; gap:8px; flex-wrap:wrap; margin-top:14px;
  }
  .badge{
    font-family:'Space Mono',monospace;
    font-size:11px;
    padding:6px 12px;
    border-radius:99px;
    background:var(--amber-soft);
    color:#8A651E;
    border:1px solid #EEDFB8;
  }
  .badge.blue{ background:var(--blue-soft); color:#2E5468; border-color:#D3E3EA; }
  footer{
    margin-top:46px;
    text-align:center;
    font-family:'Space Mono',monospace;
    font-size:11px;
    color:var(--ink-soft);
    letter-spacing:.05em;
  }
</style>
</head>
<body>

<div class="page" id="page">
  <div class="hero">
    <div class="avatar-wrap">
      <div class="avatar-ring"></div>
      <img id="avatarImg" alt="">
    </div>
    <div class="eyebrow" id="eyebrow"></div>
    <h1 id="nameEn"></h1>
    <p class="arabic-name" id="nameAr"></p>
    <p class="role" id="role"></p>
    <p class="tagline" id="tagline"></p>
  </div>
  <div id="sectionsRoot"></div>
  <section>
    <p class="section-label">At a glance</p>
    <div class="info-grid" id="infoGrid"></div>
    <div class="badge-strip" id="badgeStrip"></div>
  </section>
  <footer id="footer"></footer>
</div>

<script>

function escHtml(s){ const d=document.createElement('div'); d.textContent = (s==null?'':s); return d.innerHTML; }
function renderSite(data){
  document.title = data.meta.title;
  document.body.style.backgroundImage = "url('" + data.background + "')";
  const avatarImg = document.getElementById('avatarImg');
  avatarImg.src = data.hero.avatar;
  avatarImg.alt = data.hero.nameEn;
  document.getElementById('eyebrow').textContent = data.hero.eyebrow;
  document.getElementById('nameEn').textContent = data.hero.nameEn;
  document.getElementById('nameAr').textContent = data.hero.nameAr;
  document.getElementById('role').innerHTML = '<b>' + escHtml(data.hero.roleBold) + '</b>' + escHtml(data.hero.roleRest);
  document.getElementById('tagline').innerHTML =
    escHtml(data.hero.taglinePre) +
    '<span class="split">' + escHtml(data.hero.taglineSplit1) + '</span>' +
    escHtml(data.hero.taglineMid) +
    '<span class="split2">' + escHtml(data.hero.taglineSplit2) + '</span>';

  const sectionsRoot = document.getElementById('sectionsRoot');
  sectionsRoot.innerHTML = '';
  (data.sections||[]).forEach(function(sec){
    const s = document.createElement('section');
    const label = document.createElement('p');
    label.className = 'section-label';
    label.textContent = sec.label;
    const card = document.createElement('div');
    card.className = 'card';
    (sec.rows||[]).forEach(function(row){
      const a = document.createElement('a');
      a.className = 'row';
      a.href = row.href || '#';
      if(row.href && row.href.indexOf('http') === 0){ a.target = '_blank'; a.rel = 'noopener'; }
      a.innerHTML = '<span class="label"><span class="dot ' + (row.dot === 'amber' ? 'amber' : '') + '"></span>' + escHtml(row.label) + '</span><span class="value">' + escHtml(row.value) + '</span>';
      card.appendChild(a);
    });
    s.appendChild(label);
    s.appendChild(card);
    sectionsRoot.appendChild(s);
  });

  const infoGrid = document.getElementById('infoGrid');
  infoGrid.innerHTML = '';
  (data.infoGrid||[]).forEach(function(cell){
    const div = document.createElement('div');
    div.className = 'info-cell';
    div.innerHTML = '<div class="k">' + escHtml(cell.k) + '</div><div class="v">' + escHtml(cell.v) + '</div>';
    infoGrid.appendChild(div);
  });

  const badgeStrip = document.getElementById('badgeStrip');
  badgeStrip.innerHTML = '';
  (data.badges||[]).forEach(function(b){
    const span = document.createElement('span');
    span.className = 'badge' + (b.type === 'blue' ? ' blue' : '');
    span.textContent = b.text;
    badgeStrip.appendChild(span);
  });

  document.getElementById('footer').textContent = data.meta.footer;
}

var SITE_DATA = JSON.parse(document.getElementById('site-data').textContent);
renderSite(SITE_DATA);
</script>
