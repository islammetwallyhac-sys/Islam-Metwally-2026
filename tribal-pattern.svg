<svg xmlns="http://www.w3.org/2000/svg" width="200" height="200" viewBox="0 0 200 200">
  <g fill="none" stroke="#20262B" stroke-width="1.4" stroke-opacity="0.07">
    <!-- zigzag chevron band row 1 -->
    <polyline points="0,20 25,0 50,20 75,0 100,20 125,0 150,20 175,0 200,20"/>
    <polyline points="0,36 25,16 50,36 75,16 100,36 125,16 150,36 175,16 200,36"/>
    <!-- diamond weave row -->
    <polygon points="25,60 50,80 25,100 0,80"/>
    <polygon points="75,60 100,80 75,100 50,80"/>
    <polygon points="125,60 150,80 125,100 100,80"/>
    <polygon points="175,60 200,80 175,100 150,80"/>
    <!-- second zigzag band -->
    <polyline points="0,140 25,120 50,140 75,120 100,140 125,120 150,140 175,120 200,140"/>
    <polyline points="0,156 25,136 50,156 75,136 100,156 125,136 150,156 175,136 200,156"/>
    <!-- vertical tick marks / tribal dashes -->
    <line x1="12" y1="184" x2="12" y2="196"/>
    <line x1="37" y1="184" x2="37" y2="196"/>
    <line x1="62" y1="184" x2="62" y2="196"/>
    <line x1="87" y1="184" x2="87" y2="196"/>
    <line x1="112" y1="184" x2="112" y2="196"/>
    <line x1="137" y1="184" x2="137" y2="196"/>
    <line x1="162" y1="184" x2="162" y2="196"/>
    <line x1="187" y1="184" x2="187" y2="196"/>
  </g>
  <g fill="#D9A441" fill-opacity="0.10">
    <circle cx="25" cy="80" r="2.6"/>
    <circle cx="75" cy="80" r="2.6"/>
    <circle cx="125" cy="80" r="2.6"/>
    <circle cx="175" cy="80" r="2.6"/>
  </g>
</svg>
